<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heart</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
let W, H, K, n1, n2;
const rnd = (a, b) => a + Math.random() * (b - a);

function heart(a, s) {
  return [
    16 * Math.pow(Math.sin(a), 3) * s,
    (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * s
  ];
}

function line(x, y, x2, y2, col, w) {
  const ox = W / 2, oy = H / 2;
  g.strokeStyle = col; g.lineWidth = w * K * 1.4;
  g.beginPath();
  g.moveTo(ox + x * K, oy - (y + 40) * K);
  g.lineTo(ox + x2 * K, oy - (y2 + 40) * K);
  g.stroke();
}

function reset() {
  const d = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  c.width = W * d; c.height = H * d;
  g.setTransform(d, 0, 0, d, 0, 0);
  g.lineCap = 'round';
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  K = Math.min(W, H) / 700;
  n1 = 0; n2 = 0;
}

function frame() {
  for (let i = 0; i < 350 && n1 < 10000; i++, n1++) {
    const a = rnd(0, 2 * Math.PI), [x, y] = heart(a, rnd(0.5, 15.5));
    const ang = Math.atan2(y, x) + rnd(-0.5, 0.5), len = rnd(4, 14);
    const col = `rgb(255,${rnd(0.25, 0.55) * 255 | 0},${rnd(0.65, 0.85) * 255 | 0})`;
    line(x, y, x + len * Math.cos(ang), y + len * Math.sin(ang), col, rnd(0.5, 1.2));
  }
  if (n1 >= 10000) {
    for (let i = 0; i < 150 && n2 < 3500; i++, n2++) {
      const a = rnd(0, 2 * Math.PI), [x, y] = heart(a, 16);
      const ang = Math.atan2(y, x) + rnd(-0.35, 0.35), len = rnd(10, 32);
      const sx = x + rnd(-2, 2), sy = y + rnd(-2, 2);
      const col = `rgb(255,${rnd(0.45, 0.75) * 255 | 0},${rnd(0.75, 0.95) * 255 | 0})`;
      line(sx, sy, x + len * Math.cos(ang), y + len * Math.sin(ang), col, rnd(0.4, 0.9));
    }
  }
  requestAnimationFrame(frame);
}

addEventListener('resize', reset);
c.addEventListener('click', reset);
reset();
frame();
</script>
</body>
</html>
